<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{NAME}} — CV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page {
      size: Letter;
      margin: 0.25in 0.42in 0.25in 0.42in;
    }

    body {
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.30;
      color: #000000;
      background: #ffffff;
      padding: 0;
      margin: 0;
    }

    .page {
      width: 100%;
      max-width: 8.5in;
      margin: 0 auto;
      padding: 0;
    }

    /* === HEADER === */
    .header {
      margin-bottom: 8px;
    }

    .header h1 {
      font-family: 'Times New Roman', Times, serif;
      font-size: 19pt;
      font-weight: bold;
      color: #000000;
      letter-spacing: 0;
      margin-bottom: 5px;
      line-height: 1.1;
      text-align: center;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px 8px;
      font-family: 'Times New Roman', Times, serif;
      font-size: 11pt;
      line-height: 1.3;
      color: #000000;
    }

    .contact-label {
      font-weight: bold;
    }

    .contact-row a {
      color: #000000;
      text-decoration: none;
    }

    .contact-row .separator {
      color: #000000;
    }

    /* === SECTIONS === */
    .section {
      margin-bottom: 4px;
    }

    .section-title {
      font-family: 'Times New Roman', Times, serif;
      font-size: 13pt;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0;
      color: #000000;
      border-bottom: 1pt solid #000000;
      padding-bottom: 1px;
      margin-bottom: 3px;
      line-height: 1.2;
    }

    /* === PROFESSIONAL SUMMARY === */
    .summary-text {
      font-size: 11pt;
      line-height: 1.30;
      color: #000000;
      text-align: justify;
    }

    a {
      white-space: nowrap;
    }

    /* === WORK EXPERIENCE === */
    .job {
      margin-bottom: 3pt;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 1px;
    }

    .job-company {
      font-family: 'Times New Roman', Times, serif;
      font-size: 11.5pt;
      font-weight: bold;
      color: #000000;
    }

    .job-period {
      font-size: 11pt;
      color: #000000;
      white-space: nowrap;
      font-weight: bold;
    }

    .job-role {
      font-size: 11pt;
      font-weight: bold;
      color: #000000;
      margin-bottom: 2pt;
    }

    .job ul {
      padding-left: 16px;
      margin-top: 0;
    }

    .job li {
      font-size: 11pt;
      line-height: 1.32;
      color: #000000;
      margin-bottom: 2pt;
      text-align: left;
    }

    .job li strong {
      font-weight: bold;
    }

    /* === EDUCATION === */
    .edu-item {
      margin-bottom: 3px;
    }

    .edu-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .edu-title {
      font-weight: bold;
      font-size: 11pt;
      color: #000000;
    }

    .edu-org {
      color: #000000;
      font-weight: normal;
    }

    .edu-year {
      font-size: 11pt;
      color: #000000;
      font-weight: bold;
      white-space: nowrap;
    }

    /* === CERTIFICATIONS === */
    .cert-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 2px;
    }

    .cert-title {
      font-size: 11pt;
      font-weight: normal;
      color: #000000;
    }

    /* === SKILLS === */
    .skills-grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .skill-item {
      font-size: 11pt;
      color: #000000;
      line-height: 1.30;
    }

    .skill-category {
      font-weight: bold;
      color: #000000;
      font-size: 11pt;
    }

    /* === PRINT === */
    @media print {
      body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        padding: 0;
      }
    }

    /* === PAGE BREAK CONTROL === */
    .avoid-break,
    .job,
    .edu-item,
    .cert-item {
      break-inside: avoid;
      page-break-inside: avoid;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <div class="header avoid-break">
      <h1>{{NAME}}</h1>
      <div class="contact-row">
        <span><span class="contact-label">Email:</span> {{EMAIL}}</span>
        <span class="separator">|</span>
        <span><span class="contact-label">Mobile:</span> {{PHONE}}</span>
        <span class="separator">|</span>
        <a href="{{LINKEDIN_URL}}"><span class="contact-label">LinkedIn:</span> {{LINKEDIN_HANDLE}}</a>
        <span class="separator">|</span>
        <span><span class="contact-label">Location:</span> {{LOCATION}}</span>
      </div>
    </div>

    <!-- PROFESSIONAL SUMMARY -->
    <div class="section avoid-break">
      <div class="section-title">Professional Summary</div>
      <div class="summary-text">{{SUMMARY_TEXT}}</div>
    </div>

    <!-- WORK EXPERIENCE -->
    <div class="section">
      <div class="section-title">Work Experience</div>
      {{EXPERIENCE}}
    </div>

    <!-- SKILLS -->
    <div class="section avoid-break">
      <div class="section-title">Skills</div>
      <div class="skills-grid">
        {{SKILLS}}
      </div>
    </div>

    <!-- EDUCATION -->
    <div class="section avoid-break">
      <div class="section-title">Education</div>
      {{EDUCATION}}
    </div>

    <!-- CERTIFICATIONS -->
    <div class="section avoid-break">
      <div class="section-title">Certifications</div>
      {{CERTIFICATIONS}}
    </div>

  </div>
</body>

</html>
